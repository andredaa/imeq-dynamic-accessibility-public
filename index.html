<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Map</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        html, body {
            height: 100%;
        }
        
        #map {
            height: 100vh;
            width: 100vw;
        }

        /* Isochrone Menu Styles */
        #isochrone-menu {
            position: absolute;
            z-index: 1000;
            display: none;
            min-width: 300px;
        }

        .transport-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px;
        }

        .transport-icon {
            font-size: 20px;
        }

        .transport-label {
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <!-- Isochrone Menu -->
    <div id="isochrone-menu" class="card shadow">
        <div class="card-header">
            <h6 class="mb-0">Request Isochrones</h6>
        </div>
        <div class="card-body">
            <div class="mb-3">
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary flex-fill" id="cancel-btn">Cancel</button>
                <button class="btn btn-primary flex-fill" id="request-btn">Get Isochrones</button>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    
    <!-- Custom JavaScript -->
    <script type="module" src="map.js"></script>
    <script type="module" src="ors_request.js"></script>
</body>
</html>
